<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Contáctanos para más información sobre HontaShop">
  <title>HontaShop | Contacto</title>
  <link rel="icon" type="image/x-icon" href="logoicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="logoicon.ico" alt="Logo HontaShop">
      <h1>HontaShop</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a class="activo" href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Contactanos</h2>
    <form class="formulario">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <input type="submit" value="Enviar">
    </form>

    <section class="mapa">
      <p>Ubicacion</p>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d763.9408777324267!2d-3.0117995243351956!3d40.01372974729712!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd4283e3560a5391%3A0x5708f4d2ab9c6cd7!2sIES%20La%20Hontanilla!5e0!3m2!1sen!2ses!4v1767974173463!5m2!1sen!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>    </section>
  </main>


  <footer>
    <p>&copy; 2025 HontaShop</p>
  </footer>
</body>
</html>
